# https://taskfile.dev
version: "3"

includes:
  devlog:
    taskfile: docs/devlog/Taskfile.yml
    dir: docs/devlog

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: dependencies from the lockfile
    cmds:
      - npm ci

  run:
    desc: Firefox with the debug build loaded (Q12), rebuilt and reloaded on every change of src/; SMC_DEBUG=0 for the release's
    env:
      SMC_DEBUG: '{{.SMC_DEBUG | default "1"}}'
    cmds:
      - npm run vendor
      - npm run extension
      - node scripts/run.mjs {{.CLI_ARGS}}

  check:
    desc: Biome, changes nothing
    cmds:
      - npx biome check .

  format:
    desc: Biome with safe fixes
    cmds:
      - npx biome check --write .

  lint:ext:
    desc: web-ext lint of the build, the validator AMO runs, warnings as errors but the known false positives named in scripts/lint.mjs
    cmds:
      - npm run lint:ext

  test:
    desc: vitest
    cmds:
      - npx vitest run {{.CLI_ARGS}}

  test:firefox:
    desc: the built extension in a real Firefox, Selenium and geckodriver (Q14); screenshots in dist/shots/
    cmds:
      - npm run test:firefox -- {{.CLI_ARGS}}

  verify:
    desc: check, lint:ext, test - run before a step is reported done
    cmds:
      - task: check
      - task: lint:ext
      - task: test

  build:
    desc: "the batch (Q10, Q12): every dependency into src/vendor, readers.js and host permissions from chats.yaml, the pages built into dist/extension, the .zip into dist/"
    cmds:
      - npm run build

  # NOTE: an upload to AMO by hand is Sett's move (the AMO key and secret in .env); never run by an agent.
  # The release's amo job does it for every release; this only for one whose job failed.
  amo:
    desc: 'a released version to AMO, listed, with its source, as release.yml does it (-- v<version>)'
    dotenv: [".env"]
    cmds:
      - scripts/release/amo.sh {{.CLI_ARGS}}

  version:
    desc: 'the version of package.json written into every copy (-- bump patch|minor|major to raise it)'
    cmds:
      - node scripts/version.mjs {{.CLI_ARGS | default "sync"}}

  debug:install:
    desc: "the debug gate's native host registered for Firefox, once per machine (-- --remove undoes it); writes into your home"
    cmds:
      - node scripts/debug/install.mjs {{.CLI_ARGS}}

  extension:
    desc: the extension built into dist/extension (Q12) - the Vue pages by Vite, the rest of src as it is
    cmds:
      - npm run extension

  vendor:
    desc: every dependency of package.json copied unchanged into src/vendor (gitignored; the files of each in package.json "vendor")
    cmds:
      - npm run vendor

  chats:
    desc: src/core/readers.js and the manifest's host_permissions written from resources/data/chats.yaml (-- --check only checks)
    cmds:
      - node scripts/chats.mjs {{.CLI_ARGS}}

  github:discussions:
    desc: the devlog's news in GitHub Discussions - Announcements, Ideas per PP, almanac Q&A (-- --dry shows what it would write)
    cmds:
      - python3 scripts/github/discussions.py {{.CLI_ARGS}}

  wiki:
    desc: the wiki into dist/wiki - devlog, changelog, almanac in wiki.yaml's languages; new texts translated and kept in resources/data/translations (-- --translator none uses the memory only)
    cmds:
      - node scripts/wiki/build.mjs {{.CLI_ARGS}}

  pages:
    desc: the public site (Q13) built by Astro from site/ into dist/pages; pages.yml puts it on the github-pages branch
    cmds:
      - npm run site

  pages:dev:
    desc: the public site served with live reload, http://localhost:4321/save-my-chat/
    cmds:
      - npx astro dev

  test:site:
    desc: the public site built and tested by Playwright in Chromium and Firefox (npx playwright install chromium firefox, once)
    cmds:
      - npm run test:site -- {{.CLI_ARGS}}

  translate:server:
    desc: LibreTranslate in a container on 127.0.0.1:5000 with the wiki's languages, for task wiki (or set LIBRETRANSLATE_URL to a server)
    cmds:
      - docker run -d --name smc-libretranslate -p 127.0.0.1:5000:5000 libretranslate/libretranslate --load-only en,pl

  docs:
    desc: the Read the Docs site into dist/docs, strictly, with the mkdocs-material container (-- serve -a 0.0.0.0:8000 to preview)
    cmds:
      - docker run --rm -u "$(id -u):$(id -g)" -p 127.0.0.1:8000:8000 -v "$PWD":/docs squidfunk/mkdocs-material {{.CLI_ARGS | default "build --strict"}}

  github:devlog:
    desc: 'the devlog on GitHub - milestones of ROADMAP, an issue per phase, Q<n> and PP<n>, the board (-- --dry prints, -- --no-board skips the board)'
    cmds:
      - python3 scripts/github/devlog.py {{.CLI_ARGS}}
