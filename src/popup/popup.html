<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>save-my-chat</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<h1>save-my-chat</h1>
		<p id="state">Looking for a conversation…</p>
		<div id="actions" hidden>
			<button type="button" data-as="md">Save as Markdown</button>
			<button type="button" data-as="json">Save as JSON</button>
		</div>
		<p id="result" role="status"></p>
		<details id="seen" hidden>
			<summary>What the reader saw</summary>
			<pre id="seen-text"></pre>
			<button type="button" id="copy">Copy report</button>
		</details>
		<script src="popup.js"></script>
	</body>
</html>
