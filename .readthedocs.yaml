# Read the Docs: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# The user's and developer's documentation from docs/ (mkdocs.yml); the devlog, changelog
# and almanac are the wiki's, not built here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
