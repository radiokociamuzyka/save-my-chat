# The devlog's news in GitHub Discussions (phase 2, discussion #17), after each release:
# changelog posts, phases begun and done, proposals and releases in Announcements, a
# discussion per proposal in Ideas, almanac cases in Q&A with their solution as the answer.
# scripts/github/discussions.py; each discussion carries a marker, so a run changes only
# what differs. By hand: task github:discussions (-- --dry to see what it would write).
name: "feed › discussions after a release"

on:
  workflow_run:
    workflows: ["release › master: tag, packed extension, back into development"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  discussions: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0 # proposals are read as they stood, from the history of PROPOSALS.md
      - run: python3 scripts/github/discussions.py
        env:
          GH_TOKEN: ${{ github.token }}
