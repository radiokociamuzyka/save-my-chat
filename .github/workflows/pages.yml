# The public site (Q13): built by Astro from site/ (astro.config.mjs) into dist/pages,
# committed on the github-pages branch after each release. The branch holds the built page alone, a commit per change; GitHub
# Pages serves it once the repository's Pages are set to "deploy from a branch",
# github-pages, / (root): a repository setting, Sett's.
name: "pages › the static page after a release"

on:
  workflow_run:
    workflows: ["release › master: tag, packed extension, back into development"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # the github-pages branch is written with the workflow's token

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: master }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { HUSKY: "0" }
      - run: npm run site
      - name: the page onto github-pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the branch's work tree outside the checkout, which has a site/ of its own (the sources)
          branch="$RUNNER_TEMP/github-pages" && mkdir "$branch" && cd "$branch" && git init -q -b github-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin github-pages 2> /dev/null; then git reset -q --soft FETCH_HEAD; fi
          git rm -rq --cached --ignore-unmatch . > /dev/null
          cp -r "$GITHUB_WORKSPACE/dist/pages/." .
          git add -A
          if git rev-parse -q --verify HEAD > /dev/null && git diff --cached --quiet HEAD; then echo "the page is current"; exit 0; fi
          git commit -qm "the page generated from ${GITHUB_SHA::7} (v$(node -p "require('$GITHUB_WORKSPACE/package.json').version"))"
          git push -q origin github-pages
