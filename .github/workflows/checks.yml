name: checks

on:
  push:
    branches: [development, "dev/**"]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: save-my-chat-zip
          path: dist/*.zip
