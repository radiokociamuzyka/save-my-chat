name: checks

on:
  push:
    branches: [development, "dev/**"]
  pull_request:
    branches: [development, master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env: { HUSKY: "0" }
      - run: npm run verify
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          # a pull request builds the packed extension too (Q7); master releases it
          name: save-my-chat-zip
          path: dist/*.zip
