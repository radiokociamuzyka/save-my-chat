name: checks

on:
  push:
    branches: [development, "dev/**"]
  pull_request:
    branches: [development, master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env: { HUSKY: "0" }
      - run: npm run verify
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          # a pull request builds the packed extension too (Q7); master releases it
          name: save-my-chat-zip
          path: dist/*.zip

  firefox:
    # the built extension in a real Firefox, driven by Selenium (Q14); the runner has
    # Firefox and geckodriver ($GECKOWEBDRIVER)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env: { HUSKY: "0" }
      - run: npm run test:firefox
        env:
          GECKODRIVER: ${{ env.GECKOWEBDRIVER }}/geckodriver
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firefox-screenshots
          path: dist/shots/
